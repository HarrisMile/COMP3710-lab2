[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comp3710-lab2"
version = "0.1.0"
description = "Reproducible PyTorch solutions for COMP3710 Lab Demonstration 2"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
  "Pillow>=10.0",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["comp3710_lab2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
